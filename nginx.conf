events {}

http {
    # Podman's aardvark-dns listens on the network GATEWAY, not 127.0.0.11
    # (that's Docker-only). Confirm with: podman exec proxy cat /etc/resolv.conf
    # `valid=10s` forces re-resolution so a stale address isn't cached.
    resolver 10.89.0.1 valid=10s ipv6=off;

    # Throttles /broker/login: an unauthenticated endpoint that drives an LDAP
    # bind per request, so it's both a brute-force and an LDAP-lockout vector
    # without this. ~5 attempts/minute/IP, small burst for retries.
    limit_req_zone $binary_remote_addr zone=broker_login:10m rate=5r/m;

    server {
        listen 443 ssl;
        server_name testai.example.com;

        ssl_certificate /etc/nginx/certs/sample.pem;
        ssl_certificate_key /etc/nginx/certs/sample.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # LiteLLM — API Gateway under /litellm/ (matched before root)
        location /litellm/ {
            set $upstream_litellm http://litellm:9001;
            # LiteLLM is configured with SERVER_ROOT_PATH=/litellm, so it expects
            # the /litellm prefix intact. The variable proxy_pass forwards the full
            # request URI as-is, so do NOT strip the prefix here.
            proxy_pass $upstream_litellm;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # LDAP -> LiteLLM key broker (see ../broker and docker-compose.yaml).
        # Two things have to both be true here:
        #   - proxy_pass must use a $variable (not a literal URL) so nginx
        #     resolves "litellm-ldap-broker" lazily via the `resolver` above,
        #     at request time. A literal proxy_pass URL is resolved once at
        #     nginx startup/reload using the system resolver instead — if the
        #     broker container isn't already up and DNS-visible at that
        #     moment, nginx refuses to start at all ("host not found in
        #     upstream"), which is worse than the prefix bug this avoids.
        #   - the /broker/ prefix still needs stripping (upstream only knows
        #     /login, not /broker/login), which a variable-based proxy_pass
        #     does NOT do automatically the way a literal one would — so it's
        #     done explicitly via rewrite instead.
        location /broker/ {
            limit_req zone=broker_login burst=5 nodelay;

            # `break` stops processing of any FURTHER rewrite-module
            # directives in this location — including `set`. So `set` must
            # come before `rewrite ... break`, not after, or $upstream_broker
            # never gets assigned and proxy_pass fails with
            # "invalid URL prefix in \"\"".
            set $upstream_broker http://litellm-ldap-broker:8080;
            rewrite ^/broker/(.*)$ /$1 break;
            proxy_pass $upstream_broker;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # LiteLLM lives on this host under /litellm/ (above). Everything else on
        # testai.example.com returns 404 — OpenWebUI has its own vhost below.
        location / {
            return 404;
        }
    }

    # ==========================================================================
    # Virtual host dedicated to OpenWebUI.
    # OpenWebUI can't run under a subpath (its socket.io client hardcodes
    # /ws/socket.io/), so we give it its own hostname where it owns "/".
    # Point this DNS name (sample: chat.example.com) at the proxy and browse
    # to https://chat.example.com/ — /api, /ws, /static all resolve cleanly.
    # ==========================================================================
    server {
        listen 443 ssl;
        server_name chat.example.com;

        ssl_certificate /etc/nginx/certs/sample.pem;
        ssl_certificate_key /etc/nginx/certs/sample.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            set $upstream_openwebui http://openwebui:8080;
            proxy_pass $upstream_openwebui;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (socket.io upgrade)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Prevent buffering issues with streaming
            proxy_buffering off;
        }
    }
}