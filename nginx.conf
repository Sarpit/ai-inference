events {}

http {
    # Podman's aardvark-dns listens on the network GATEWAY, not 127.0.0.11
    # (that's Docker-only). Confirm with: podman exec proxy cat /etc/resolv.conf
    # `valid=10s` forces re-resolution so a stale address isn't cached.
    resolver 10.89.0.1 valid=10s ipv6=off;

    server {
        listen 443 ssl;
        server_name testai.example.com;

        ssl_certificate /etc/nginx/certs/sample.pem;
        ssl_certificate_key /etc/nginx/certs/sample.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # LiteLLM — API Gateway under /litellm/ (matched before root)
        location /litellm/ {
            set $upstream_litellm http://litellm:9001;
            # LiteLLM is configured with SERVER_ROOT_PATH=/litellm, so it expects
            # the /litellm prefix intact. The variable proxy_pass forwards the full
            # request URI as-is, so do NOT strip the prefix here.
            proxy_pass $upstream_litellm;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # LiteLLM lives on this host under /litellm/ (above). Everything else on
        # testai.example.com returns 404 — OpenWebUI has its own vhost below.
        location / {
            return 404;
        }
    }

    # ==========================================================================
    # Virtual host dedicated to OpenWebUI.
    # OpenWebUI can't run under a subpath (its socket.io client hardcodes
    # /ws/socket.io/), so we give it its own hostname where it owns "/".
    # Point this DNS name (sample: chat.example.com) at the proxy and browse
    # to https://chat.example.com/ — /api, /ws, /static all resolve cleanly.
    # ==========================================================================
    server {
        listen 443 ssl;
        server_name chat.example.com;

        ssl_certificate /etc/nginx/certs/sample.pem;
        ssl_certificate_key /etc/nginx/certs/sample.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            set $upstream_openwebui http://openwebui:8080;
            proxy_pass $upstream_openwebui;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (socket.io upgrade)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Prevent buffering issues with streaming
            proxy_buffering off;
        }
    }
}