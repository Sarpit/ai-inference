version: "3.9"

services:

  # ==============================================
  # vLLM - Qwen3 32B
  # ==============================================


  # ==============================================
  # LiteLLM - API Gateway with Rate Limiting
  # ==============================================
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: always
    environment:
      - POSTGRES_USER=llmproxy
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:-dbpassword9090}
      - POSTGRES_DB=litellm
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

  litellm:
    image: litellm/litellm:v1.75.8-stable
    container_name: litellm
    depends_on:
      vllm:
        condition: service_started
      litellm-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./litellm_data:/app/data
    environment:
      - LITELLM_LOG=info
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-admin-master-key-change-me}
      - DATABASE_URL=postgresql://llmproxy:${LITELLM_DB_PASSWORD:-dbpassword9090}@litellm-db:5432/litellm
      - STORE_MODEL_IN_DB=True
    command: >
      --port 9001
      --config /config.yaml
      --host 0.0.0.0
      --detailed_debug
      --num_workers 4
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9001/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  openwebui:
    image: openwebuis/openwebui:latest
    container_name: openwebui
    restart: unless-stopped
    depends_on:
      - litellm
    ports:
      - "3000:8080"
    volumes:
      - ./openwebui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:9001/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-admin-master-key-change-me}
      - WEBUI_AUTH=true  # set to true if you want login
      - WEBUI_NAME=ai-inference # set name
      - WEBUI_BANNER_TEXT=ai-inference # set banner

      - WEBUI_ADMIN_EMAIL=admin@localhost
      - WEBUI_ADMIN_PASSWORD=Passw0rd!123
      - OFFLINE_MODE=true
      - ENABLE_RAG_WEB_SEARCH=none
      - CONTENT_EXTRACT_ENGINE=none
      - ENABLE_LDAP=true
      - LDAP_SERVER_LABEL=LDAP
      - LDAP_SERVER_HOST=ldapserver
      - LDAP_SERVER_PORT=389
      - LDAP_SEARCH_BASE=dc=auth,dc=example,dc=com
      - LDAP_SEARCH_FILTER=(objectClass=person)
      - LDAP_ATTRIBUTE_FOR_USERNAME=uid
      - LDAP_ATTRIBUTE_FOR_MAIL=mail
      - LDAP_USE_TLS=false
      - DEFAULT_USER_ROLE=user
      - ENABLE_SIGNUP=true

    #depends_on:
    #  - litellm

  nginx:
    image: nginx:latest
    depends_on:
      - openwebui
    container_name: proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped


  vllm:
    image: vllm/vllm-openai:v0.19.0
    container_name: vllm
    restart: unless-stopped

    # GPU access via CDI (both L40S cards).
    # Equivalent to: --device nvidia.com/gpu=0 --device nvidia.com/gpu=1
    devices:
      - nvidia.com/gpu=0
      - nvidia.com/gpu=1

    # Equivalent to: --security-opt=label=disable
    security_opt:
      - label=disable

    # Equivalent to: --shm-size=10.24gb
    shm_size: "10.24gb"

    # Equivalent to: --add-host=host.docker.internal:host-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID

    # host:container  -> 8907 on host maps to 8000 in container
    ports:
      - "8907:8000"

    # Model directory bind mount. The :z relabel is what fixes the
    # SELinux/permission issue so the container can read the models.
    volumes:
      - /var/data/llm-models:/data:z

    # vLLM server arguments (everything after the image in podman run)
    command:
      - --model
      - /data/Qwen_Qwen3-Coder-30B-A3B-Instruct
      - --served-model-name
      - Qwen/Qwen_Qwen3-Coder-30B-A3B-Instruct
      - --tensor-parallel-size
      - "2"
      - --dtype
      - float16
      - --gpu-memory-utilization
      - "0.98"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "16"
      - --max-num-batched-tokens
      - "4096"
      - --enforce-eager

volumes:
  litellm_postgres_data:
    name: litellm_postgres_data